# 静的サイト (信号生成・解析ツール) を GitHub Pages にデプロイする。
# ブラウザで動く内容だけを集める。ビルド工程はない (素のES Modules)。
name: Deploy GitHub Pages

on:
  push:
    # このリポジトリの既定ブランチ (claude/...) と main の両方で起動する。
    # Pagesのgithub-pages環境は既定ブランチからのデプロイを許可するため、
    # 既定ブランチをmainへ切り替えた後もそのまま動く。
    branches: [main, claude/ews-tool-creation-6r6x6x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web _site/web
          cp -r src _site/src
          cp -r docs _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
